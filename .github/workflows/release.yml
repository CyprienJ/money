name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Compile sqlx queries against the committed .sqlx/ cache instead of a live database.
env:
  SQLX_OFFLINE: "true"

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Native PDF library, bundled as a resource.
      - name: Download PDFium
        shell: bash
        run: tools/fetch_pdfium.sh

      # .deb, .rpm and AppImage on Linux; .msi and NSIS on Windows.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Finances perso v__VERSION__
          releaseBody: Installeurs Windows et Linux.
          releaseDraft: true
          prerelease: false
