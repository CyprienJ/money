[package]
name = "money"
version = "0.1.0"
description = "Local personal finance desktop application"
edition = "2024"

[lib]
name = "money_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tauri = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
