[package]
name = "money"
version = "0.1.0"
description = "Local personal finance desktop application"
edition = "2024"

[lib]
name = "money_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
csv = "1.4.0"
encoding_rs = "0.8.42"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono"] }
specta-typescript = "=0.0.12"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros", "chrono"] }
tauri = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
